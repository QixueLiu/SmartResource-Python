[project]
name = "smartresource-python"
version = "0.20.0"
description = "Local self-hosted website search and analysis for SmartResource Android"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.7,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
  "httpx>=0.27,<1.0",
  "beautifulsoup4>=4.12,<5.0"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
browser = ["playwright>=1.50,<2.0"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["smartresource*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
